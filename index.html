<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tampawn SMP Store</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800&display=swap" rel="stylesheet">

<style>

body{
    margin:0;
    font-family:'Orbitron',sans-serif;
    background: radial-gradient(circle at top, #111 0%, #050505 60%, #000 100%);
    color:white;
}

/* HEADER */
header{
    text-align:center;
    padding:60px 20px;
    background:linear-gradient(90deg,#ff00cc,#00ccff,#00ff88,#ffee00);
    color:black;
}

header h1{font-size:50px;margin:0;}

/* GRID */
.grid{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:25px;
    padding:30px;
}

/* CARD */
.card{
    width:320px;
    background:#111;
    border-radius:18px;
    padding:20px;
    border:1px solid rgba(255,255,255,0.1);
    transition:0.3s;
}

.card:hover{
    transform:translateY(-8px);
    box-shadow:0 0 25px rgba(0,255,170,0.25);
}

/* DISPLAY IMAGE (FIXED) */
.card img{
    width:100%;
    height:200px;
    object-fit:contain; /* FIX: no cropping */
    border-radius:12px;
    margin:10px 0;
    background:#000;
}

.price{
    color:#00ffcc;
    font-size:20px;
    margin:10px 0;
}

/* BUTTONS */
.btn{
    display:block;
    margin-top:10px;
    padding:12px;
    border-radius:10px;
    text-align:center;
    cursor:pointer;
    font-weight:bold;
    border:none;
}

.details{background:#333;color:white;}
.buy{background:linear-gradient(90deg,#ff00cc,#00ccff,#00ff88,#ffee00);color:black;}

/* MODAL */
.modal{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.9);
    justify-content:center;
    align-items:center;
    z-index:999;
}

.modal-content{
    width:90%;
    max-width:700px;
    background:#111;
    padding:20px;
    border-radius:15px;
    border:1px solid #00ffaa;
    max-height:85vh;
    overflow:auto;
}

.close{
    float:right;
    cursor:pointer;
    color:#ff5555;
    font-size:18px;
}

/* MODAL IMAGES FIXED */
#imgContainer{
    display:flex;
    gap:10px;
    overflow-x:auto;
}

#imgContainer img{
    width:100%;
    max-height:400px;
    object-fit:contain; /* FIX: FULL IMAGE ALWAYS VISIBLE */
    border-radius:12px;
    flex:0 0 100%;
    background:#000;
}

/* LIST */
ul{text-align:left;}

</style>
</head>

<body>

<header>
    <h1>Tampawn SMP Store</h1>
</header>

<div class="grid">

<div class="card">
<h2>🌾 Farmer Kit</h2>
<img src="display1.png">
<div class="price">$5 Lifetime</div>
<button class="btn details" onclick="openModal('farmer')">View Details</button>
<a class="btn buy">Buy via Discord</a>
</div>

<div class="card">
<h2>⚙️ Redstone Kit</h2>
<img src="display2.png">
<div class="price">$5 Lifetime</div>
<button class="btn details" onclick="openModal('redstone')">View Details</button>
<a class="btn buy">Buy via Discord</a>
</div>

<div class="card">
<h2>☠️ Totem Kit</h2>
<img src="display3.png">
<div class="price">$5 Lifetime</div>
<button class="btn details" onclick="openModal('totem')">View Details</button>
<a class="btn buy">Buy via Discord</a>
</div>

<div class="card">
<h2>🏗️ Builder Kit</h2>
<img src="display4.png">
<div class="price">$5 Lifetime</div>
<button class="btn details" onclick="openModal('builder')">View Details</button>
<a class="btn buy">Buy via Discord</a>
</div>

</div>

<!-- MODAL -->
<div id="modal" class="modal">
<div class="modal-content">

<span class="close" onclick="closeModal()">✖</span>

<div id="imgContainer"></div>

<h2 id="title"></h2>
<p id="desc"></p>
<ul id="list"></ul>

</div>
</div>

<script>

function openModal(type){

const data = {
farmer:{
title:"🌾 Farmer Kit",
imgs:["farmer-1.png","farmer-2.png"],
desc:"Farming kit with storage.",
list:["$5 Lifetime","2 Shulkers","Weekly Claims"]
},

redstone:{
title:"⚙️ Redstone Kit",
imgs:["redstone-1.png"],
desc:"Automation kit.",
list:["$5 Lifetime","1 Shulker Box"]
},

totem:{
title:"☠️ Totem Kit",
imgs:["totem-1.png","totem-2.png"],
desc:"Survival protection kit.",
list:["$5 Lifetime","Totems Included","2 Shulkers"]
},

builder:{
title:"🏗️ Builder Kit",
imgs:["builder-1.png"],
desc:"Fly in claims + building tools.",
list:["$5 Lifetime","Fly Enabled","Builder Tools"]
}
};

const kit = data[type];

document.getElementById("title").innerText = kit.title;
document.getElementById("desc").innerText = kit.desc;

const container = document.getElementById("imgContainer");
container.innerHTML = "";

/* FIX: ONLY LOAD VALID IMAGES */
kit.imgs
.filter(src => src && src.trim() !== "")
.forEach(src=>{
    const img = document.createElement("img");
    img.src = src;

    // remove broken images completely
    img.onerror = () => img.remove();

    container.appendChild(img);
});

document.getElementById("list").innerHTML = "";

kit.list.forEach(i=>{
    const li = document.createElement("li");
    li.innerText = i;
    document.getElementById("list").appendChild(li);
});

document.getElementById("modal").style.display = "flex";
}

function closeModal(){
document.getElementById("modal").style.display = "none";
}

</script>

</body>
</html>
