<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tampawn SMP Store</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #0f0f0f;
  color: white;
}

h1 {
  text-align: center;
  padding: 20px;
}

.section-title {
  text-align: center;
  margin-top: 35px;
  font-size: 22px;
  color: #ffd700;
}

/* KIT GRID */
.kit-container {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 15px;
  padding: 20px;
}

.kit {
  background: #1e1e1e;
  width: 220px;
  border-radius: 12px;
  padding: 15px;
  text-align: center;
}

.kit img {
  width: 100%;
  border-radius: 10px;
}

.kit button {
  margin-top: 10px;
  padding: 8px;
  border: none;
  border-radius: 8px;
  background: #4caf50;
  color: white;
  cursor: pointer;
}

/* MODAL FIX (IMPORTANT) */
.modal {
  display: none;
  position: fixed;
  z-index: 9999;
  left: 0;
  top: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.85);

  justify-content: center;
  align-items: center;
}

.modal.show {
  display: flex;
}

.modal-content {
  background: #1e1e1e;
  width: 380px;
  padding: 20px;
  border-radius: 12px;
  text-align: center;
}

.modal-content img {
  width: 100%;
  border-radius: 10px;
}

.close {
  float: right;
  font-size: 22px;
  cursor: pointer;
}

/* COINS */
.coins {
  margin-top: 30px;
  padding: 20px;
  text-align: center;
  background: #151515;
}
</style>
</head>

<body>

<h1>🔥 Tampawn SMP Store</h1>

<!-- KITS -->
<div class="section-title">💎 Kits</div>
<div class="kit-container">

<div class="kit">
<img src="farmer-1.png">
<h3>Farmer</h3>
<button onclick="openKit('farmer')">Details</button>
</div>

<div class="kit">
<img src="redstone-1.png">
<h3>Redstone</h3>
<button onclick="openKit('redstone')">Details</button>
</div>

<div class="kit">
<img src="totem-1.png">
<h3>Totem</h3>
<button onclick="openKit('totem')">Details</button>
</div>

<div class="kit">
<img src="builder-1.png">
<h3>Builder</h3>
<button onclick="openKit('builder')">Details</button>
</div>

</div>

<div class="section-title">⭐ VIP</div>
<div class="kit-container">

<div class="kit">
<img src="vip-1.png">
<h3>VIP</h3>
<button onclick="openKit('vip')">Details</button>
</div>

<div class="kit">
<img src="premium-1.png">
<h3>Premium VIP</h3>
<button onclick="openKit('premium')">Details</button>
</div>

<div class="kit">
<img src="godly-1.png">
<h3>Godly</h3>
<button onclick="openKit('godly')">Details</button>
</div>

</div>

<!-- COINS -->
<div class="coins">
<h2>🪙 TampCoins</h2>
<p>500 = $2.50</p>
<p>1000 = $5</p>
<p>1500 = $7.50</p>
<p>2000 = $10</p>
<p>5000 = $20 (gift bonus)</p>
</div>

<!-- MODAL -->
<div id="kitModal" class="modal">
<div class="modal-content">
<span class="close" onclick="closeKit()">&times;</span>

<img id="kitImage">
<h2 id="kitName"></h2>
<h3 id="kitPrice"></h3>
<div id="kitDetails"></div>

</div>
</div>

<script>
const kits = {

farmer: {
name: "Farmer Kit",
price: "$5 Permanent",
image: "farmer-1.png",
details: `
✔ Permanent Access<br>
✔ 2 Shulker Boxes<br>
✔ Farming tools<br>
`
},

redstone: {
name: "Redstone Kit",
price: "$5 Permanent",
image: "redstone-1.png",
details: `
✔ Permanent Access<br>
✔ 1 Shulker Box<br>
✔ Redstone utilities<br>
`
},

totem: {
name: "Totem Kit",
price: "$5 Permanent",
image: "totem-1.png",
details: `
✔ Permanent Access<br>
✔ 2 Shulker Boxes<br>
✔ Survival gear<br>
`
},

builder: {
name: "Builder Kit",
price: "$5 Permanent",
image: "builder-1.png",
details: `
✔ Fly inside land claims ONLY<br>
✔ Building tools<br>
✔ No PvP advantage<br>
`
},

vip: {
name: "VIP",
price: "$10 Monthly",
image: "vip-1.png",
details: `
✔ Weekly kit (4x monthly)<br>
✔ 400x400 land claim<br>
✔ VIP perks<br>
`
},

premium: {
name: "Premium VIP",
price: "$25 Monthly",
image: "premium-1.png",
details: `
✔ VIP OR 2 kits of choice<br>
✔ Weekly god-tier rewards<br>
✔ 15 land claims<br>
✔ 200 daily coins<br>
✔ $50,000 daily cash<br>
✔ Cosmetics (future)<br>
✔ NPC upgrades (future)<br>
`
},

godly: {
name: "Godly Kit",
price: "$60 Lifetime",
image: "godly-1.png",
details: `
👑 ALL KITS INCLUDED<br>
✔ Farmer, Redstone, Totem, Builder, VIP, Premium<br>
✔ Lifetime access<br>
✔ Future kit access included<br>
`
}

};

function openKit(id){
const kit = kits[id];

document.getElementById("kitImage").src = kit.image;
document.getElementById("kitName").innerHTML = kit.name;
document.getElementById("kitPrice").innerHTML = kit.price;
document.getElementById("kitDetails").innerHTML = kit.details;

document.getElementById("kitModal").classList.add("show");
}

function closeKit(){
document.getElementById("kitModal").classList.remove("show");
}

window.onclick = function(e){
if(e.target.id === "kitModal"){
closeKit();
}
};
</script>

</body>
</html>
